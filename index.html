<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passion | Coming Soon</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

    background:#050505;
    color:#fff;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

}

/* Animated Gold Glow */

body::before{

    content:"";

    position:absolute;

    width:900px;
    height:900px;

    background:
    radial-gradient(circle,
    rgba(212,175,55,.18),
    transparent 70%);

    animation:pulse 8s ease-in-out infinite;

    z-index:0;

}

@keyframes pulse{

    0%,100%{
        transform:scale(.9);
        opacity:.35;
    }

    50%{
        transform:scale(1.2);
        opacity:.8;
    }

}

/* Floating Particles */

#particles{

    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;

}

.particle{

    position:absolute;

    background:#D4AF37;

    border-radius:50%;

    opacity:.4;

    animation:rise linear infinite;

}

@keyframes rise{

    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-10vh);
    }

}

/* Main Layout */

.container{

    position:relative;
    z-index:5;

    width:min(1400px,90%);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:80px;

    align-items:center;

}

.left{

    text-align:left;

}

.right{

    display:flex;
    justify-content:center;
    align-items:center;

}

/* Logo */

.logo{

    width:min(520px,100%);
    height:auto;

    filter:
    drop-shadow(0 0 30px rgba(212,175,55,.3));

    animation:
    float 7s ease-in-out infinite,
    fade 1.8s ease;

}

@keyframes fade{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

}

/* Text */

.small{

    color:#C8A951;

    letter-spacing:8px;

    font-size:13px;

    font-weight:600;

    text-transform:uppercase;

}

.title{

    margin-top:22px;

    font-size:clamp(3rem,6vw,5.5rem);

    line-height:1;

    font-weight:700;

    background:
    linear-gradient(
    90deg,
    #ffffff,
    #FFD700,
    #FFF8DC,
    #D4AF37,
    #ffffff);

    background-size:300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:textGradient 6s linear infinite;

}

.subtitle{

    margin-top:25px;

    font-size:1.3rem;

    line-height:1.8;

    max-width:560px;

    background:
    linear-gradient(
    90deg,
    #bbbbbb,
    #ffffff,
    #FFD700,
    #ffffff,
    #bbbbbb);

    background-size:300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:textGradient 8s linear infinite;

}

@keyframes textGradient{

    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }

}
  /* Divider */

.divider{

    width:220px;
    height:2px;

    margin:45px 0;

    background:linear-gradient(
    90deg,
    transparent,
    #D4AF37,
    #FFD700,
    #D4AF37,
    transparent);

    background-size:300%;

    animation:shine 4s linear infinite;

}

@keyframes shine{

    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }

}

/* Discord Button */

.discord-btn{

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:18px 38px;

    border-radius:999px;

    text-decoration:none;

    color:white;

    font-size:17px;
    font-weight:600;

    border:1px solid rgba(212,175,55,.35);

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    transition:.35s ease;

    box-shadow:
    0 10px 35px rgba(0,0,0,.35);

}

.discord-btn:hover{

    transform:translateY(-4px);

    background:#D4AF37;

    color:#111;

    box-shadow:
    0 0 40px rgba(212,175,55,.5);

}

/* Responsive */

@media (max-width:1024px){

.container{

grid-template-columns:1fr;
gap:60px;

text-align:center;

}

.left{

order:2;
text-align:center;

}

.right{

order:1;

}

.subtitle{

margin-left:auto;
margin-right:auto;

}

.divider{

margin:45px auto;

}

.logo{

width:340px;

}

}

@media (max-width:600px){

.title{

font-size:3rem;

}

.subtitle{

font-size:1.05rem;

}

.discord-btn{

width:100%;

}

.logo{

width:260px;

}

}

</style>

</head>

<body>

<div id="particles"></div>

<div class="container">

<div class="left">

<div class="small">
COMING SOON
</div>

<h1 class="title">
Passion<br>
is Coming.
</h1>

<p class="subtitle">
Crafted with purpose.<br>
Built for the community.<br>
Luxury begins here.
</p>

<div class="divider"></div>

<a
class="discord-btn"
href="https://discord.gg/passions"
target="_blank"
rel="noopener">

Join Our Discord

</a>

</div>

<div class="right">

<img
src="logo.png"
class="logo"
alt="Passion Logo">

</div>

</div>

<script>

const particles=document.getElementById("particles");

for(let i=0;i<90;i++){

const p=document.createElement("div");

p.className="particle";

const size=Math.random()*4+2;

p.style.width=size+"px";
p.style.height=size+"px";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=
(Math.random()*8+6)+"s";

p.style.animationDelay=
Math.random()*8+"s";

p.style.opacity=Math.random()*0.6+0.2;

particles.appendChild(p);

}

</script>

</body>
</html>
